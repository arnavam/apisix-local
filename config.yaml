apisix:
  router:
    http: radixtree_uri_with_parameter   # routes use :param segments (from OpenAPI {param})

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    allow_admin:
      - 0.0.0.0/0          # local only; restrict to internal CIDRs elsewhere
    enable_admin_ui: true
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
